<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="wood512" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8b5233"/>
      <stop offset="70%" stop-color="#5a2f18"/>
      <stop offset="100%" stop-color="#3d1e0d"/>
    </radialGradient>
    <radialGradient id="pit512" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2d170d"/>
      <stop offset="85%" stop-color="#47291d"/>
      <stop offset="100%" stop-color="#693b22"/>
    </radialGradient>
    <radialGradient id="seed1_512" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe6a7"/>
      <stop offset="50%" stop-color="#f4bc54"/>
      <stop offset="100%" stop-color="#a46b28"/>
    </radialGradient>
    <radialGradient id="seed2_512" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff0ce"/>
      <stop offset="55%" stop-color="#e2a942"/>
      <stop offset="100%" stop-color="#8c551b"/>
    </radialGradient>
    <filter id="shadow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Board background -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#wood512)" stroke="#271106" stroke-width="16" filter="url(#shadow512)"/>
  
  <!-- Carved pit -->
  <ellipse cx="256" cy="256" rx="180" ry="180" fill="url(#pit512)" stroke="#f4bc54" stroke-width="12" stroke-opacity="0.9"/>
  <ellipse cx="256" cy="256" rx="166" ry="166" fill="none" stroke="#1d0a03" stroke-width="8"/>

  <!-- Seeds inside pit -->
  <ellipse cx="256" cy="192" rx="55" ry="44" fill="url(#seed1_512)" transform="rotate(-15 256 192)" filter="url(#shadow512)"/>
  <ellipse cx="256" cy="320" rx="55" ry="44" fill="url(#seed2_512)" transform="rotate(20 256 320)" filter="url(#shadow512)"/>
  <ellipse cx="192" cy="256" rx="44" ry="55" fill="url(#seed2_512)" transform="rotate(10 192 256)" filter="url(#shadow512)"/>
  <ellipse cx="320" cy="256" rx="44" ry="55" fill="url(#seed1_512)" transform="rotate(-25 320 256)" filter="url(#shadow512)"/>
</svg>