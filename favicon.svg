<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="wood" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8b5233"/>
      <stop offset="70%" stop-color="#5a2f18"/>
      <stop offset="100%" stop-color="#3d1e0d"/>
    </radialGradient>
    <radialGradient id="pit" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2d170d"/>
      <stop offset="85%" stop-color="#47291d"/>
      <stop offset="100%" stop-color="#693b22"/>
    </radialGradient>
    <radialGradient id="seed1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe6a7"/>
      <stop offset="50%" stop-color="#f4bc54"/>
      <stop offset="100%" stop-color="#a46b28"/>
    </radialGradient>
    <radialGradient id="seed2" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff0ce"/>
      <stop offset="55%" stop-color="#e2a942"/>
      <stop offset="100%" stop-color="#8c551b"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Board background -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#wood)" stroke="#301509" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Carved pit -->
  <ellipse cx="64" cy="64" rx="46" ry="46" fill="url(#pit)" stroke="#f4bc54" stroke-width="3" stroke-opacity="0.85"/>
  <ellipse cx="64" cy="64" rx="42" ry="42" fill="none" stroke="#220e06" stroke-width="2"/>

  <!-- Seeds inside pit -->
  <!-- Seed 1: Top -->
  <ellipse cx="64" cy="48" rx="14" ry="11" fill="url(#seed1)" transform="rotate(-15 64 48)" filter="url(#shadow)"/>
  <!-- Seed 2: Bottom -->
  <ellipse cx="64" cy="80" rx="14" ry="11" fill="url(#seed2)" transform="rotate(20 64 80)" filter="url(#shadow)"/>
  <!-- Seed 3: Left -->
  <ellipse cx="48" cy="64" rx="11" ry="14" fill="url(#seed2)" transform="rotate(10 48 64)" filter="url(#shadow)"/>
  <!-- Seed 4: Right -->
  <ellipse cx="80" cy="64" rx="11" ry="14" fill="url(#seed1)" transform="rotate(-25 80 64)" filter="url(#shadow)"/>
</svg>